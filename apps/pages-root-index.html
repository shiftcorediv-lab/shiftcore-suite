<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <style>
    body { margin: 0; background: #f4f6f8; color: #1f2933; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(680px, calc(100% - 32px)); margin: 64px auto; padding: 32px; box-sizing: border-box; background: #fff; border: 1px solid #d9e0e7; border-radius: 16px; box-shadow: 0 12px 32px rgba(31, 41, 51, .08); }

    p { margin: 0 0 24px; color: #52606d; }

    a { display: block; padding: 14px 16px; border: 1px solid #cbd5df; border-radius: 10px; color: #0b5cab; font-weight: 700; text-decoration: none; }
    a:hover, a:focus-visible { border-color: #0b5cab; background: #f0f7ff; outline: 3px solid rgba(11, 92, 171, .18); outline-offset: 2px; }
  </style>
</head>

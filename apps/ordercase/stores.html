<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="../common/environment.js?v=20260902-banner-height-1"></script>
<title>オーダー 店舗マスター</title><link rel="stylesheet" href="./css/common.css"><link rel="stylesheet" href="./css/master-management.css">
<script defer src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script><script defer src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
<style>
main{max-width:1180px}.toolbar{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.store-list{display:grid;gap:8px}.store-row{display:grid;grid-template-columns:1.1fr 1.5fr 1fr .7fr auto;gap:10px;align-items:center;padding:15px 17px;border:1px solid #e6ebf2;border-radius:15px;background:#fff}.store-row.archived{opacity:.65}.badge{font-size:12px;padding:4px 9px;border-radius:99px;background:#e8f5e9;color:#177245}.archived .badge{background:#eee;color:#666}.dialog-backdrop{position:fixed;inset:0;background:rgba(17,31,52,.52);display:flex;align-items:center;justify-content:center;padding:16px;z-index:2000}.dialog{width:min(820px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:24px}.member-rule-fields{margin-top:16px;padding:16px;background:#f7f9fc;border-radius:15px}.member-rule-fields textarea{min-height:72px}.member-rule-fields .hint{margin:4px 0 0;font-size:12px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.danger{background:#8b3a31}.hidden{display:none!important}@media(max-width:760px){.store-row{grid-template-columns:1fr auto}.store-row>span:nth-child(3),.store-row>span:nth-child(4){display:none}}
</style><script src="../theme/shiftcore-theme.js"></script><link rel="stylesheet" href="../theme/shiftcore-theme.css?v=20260903-module-header-1"></head><body><header id="ordercaseHeader"></header><main>
<section><p class="master-eyebrow">ORDER MASTER</p><h2>店舗マスター</h2><p class="hint">代理店に紐づく店舗情報と、店舗単位の配置ルールを管理します。過去案件は変更されません。</p>
<div class="toolbar"><input id="searchInput" placeholder="代理店名・店舗名・略称で検索"><label><input id="showArchived" type="checkbox"> アーカイブ済みも表示</label></div><div id="messageBox" class="message"></div></section>
<div id="storeList" class="store-list"></div></main>
<div id="editorBackdrop" class="dialog-backdrop hidden"><div class="dialog"><h2 id="editorTitle">店舗編集</h2><input id="editStoreId" type="hidden"><div class="grid two">
<div><label>代理店</label><select id="editAgencyId"></select></div><div><label>正式店舗名</label><input id="editStoreName"></div><div><label>店舗略称</label><input id="editStoreShortName"></div><div><label>エリア</label><input id="editStoreArea"></div><div><label>住所</label><input id="editAddress"></div><div><label>最寄り駅</label><input id="editNearestStation"></div></div>
<div class="grid two member-rule-fields"><div><label>店舗指名メンバー</label><textarea id="editPreferredMemberIds" placeholder="例：AN0001, AN0002"></textarea><label>指名理由</label><textarea id="editPreferredNote" placeholder="例：店舗からの指名"></textarea><p class="hint">シフト候補の先頭に表示します。</p></div><div><label>店舗NGメンバー（非推奨）</label><textarea id="editNgMemberIds" placeholder="例：AN0099"></textarea><label>NG理由</label><textarea id="editNgNote" placeholder="例：店舗との相性を考慮"></textarea><p class="hint">配置は禁止せず、理由を示して確認します。</p></div></div>
<div class="actions"><button id="archiveButton" type="button" class="danger">アーカイブ</button><button id="cancelButton" type="button" class="secondary">閉じる</button><button id="saveButton" type="button">保存</button></div></div></div>
<script src="./js/config.js"></script><script src="./js/utils.js"></script><script src="./js/auth-session.js"></script><script src="./js/api.js?v=20260905-agency-master-1"></script><script src="./js/navigation.js?v=20260905-agency-master-1"></script>
<script>
const state={agencies:[],stores:[],editing:null};
const searchInput=document.getElementById('searchInput'),showArchived=document.getElementById('showArchived'),storeList=document.getElementById('storeList'),messageBox=document.getElementById('messageBox'),editorBackdrop=document.getElementById('editorBackdrop'),editorTitle=document.getElementById('editorTitle'),editStoreId=document.getElementById('editStoreId'),editAgencyId=document.getElementById('editAgencyId'),editStoreName=document.getElementById('editStoreName'),editStoreShortName=document.getElementById('editStoreShortName'),editStoreArea=document.getElementById('editStoreArea'),editAddress=document.getElementById('editAddress'),editNearestStation=document.getElementById('editNearestStation'),editPreferredMemberIds=document.getElementById('editPreferredMemberIds'),editPreferredNote=document.getElementById('editPreferredNote'),editNgMemberIds=document.getElementById('editNgMemberIds'),editNgNote=document.getElementById('editNgNote'),archiveButton=document.getElementById('archiveButton'),cancelButton=document.getElementById('cancelButton'),saveButton=document.getElementById('saveButton');
document.addEventListener('DOMContentLoaded',async()=>{try{renderOrderCaseHeader('stores','店舗・配置ルール管理');const p=await fetchApiJson('getOrderCasePermission');if(!p.ok||!p.data?.can_edit)throw new Error('店舗マスターの編集権限がありません。');await loadStores();searchInput.addEventListener('input',renderStores);showArchived.addEventListener('change',renderStores);cancelButton.addEventListener('click',closeEditor);saveButton.addEventListener('click',()=>saveStore(state.editing?.status||'active'));archiveButton.addEventListener('click',toggleArchive);}catch(e){setMessage(e.message,'error')}});
async function loadStores(){const [a,j]=await Promise.all([fetchApiJson('listAgenciesMaster'),fetchApiJson('listStoresMaster')]);if(!a.ok)throw new Error(a.message||'代理店一覧を取得できませんでした。');if(!j.ok)throw new Error(j.message||'店舗一覧を取得できませんでした。');state.agencies=a.data||[];state.stores=j.data||[];editAgencyId.innerHTML=state.agencies.filter(r=>String(r.status||'active')==='active').map(r=>`<option value="${escapeHtml(r.agency_id)}">${escapeHtml(r.agency_name)}</option>`).join('');renderStores()}
function normalizeText(v){return String(v||'').trim().normalize('NFKC').replace(/\s+/g,'').toLowerCase()}
function renderStores(){const k=normalizeText(searchInput.value),show=showArchived.checked;const rows=state.stores.filter(r=>(show||String(r.status||'active')!=='archived')&&(!k||normalizeText([r.agency_name,r.store_name,r.store_short_name].join(' ')).includes(k)));storeList.innerHTML=rows.map(r=>`<div class="store-row ${r.status==='archived'?'archived':''}"><span>${escapeHtml(r.agency_name)}</span><strong>${escapeHtml(r.store_name)}</strong><span>${escapeHtml(r.store_short_name||'-')}</span><span class="badge">${r.status==='archived'?'アーカイブ':'有効'}</span><button type="button" data-edit="${escapeHtml(r.store_id)}">編集</button></div>`).join('')||'<p class="hint">該当する店舗はありません。</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openEditor(b.dataset.edit)))}
function openEditor(id){const r=state.stores.find(x=>x.store_id===id);if(!r)return;state.editing=r;editStoreId.value=r.store_id||'';editAgencyId.value=r.agency_id||'';editStoreName.value=r.store_name||'';editStoreShortName.value=r.store_short_name||'';editStoreArea.value=r.store_area||'';editAddress.value=r.address||'';editNearestStation.value=r.nearest_station||'';editPreferredMemberIds.value=r.preferred_member_ids||'';editPreferredNote.value=r.preferred_note||'';editNgMemberIds.value=r.ng_member_ids||'';editNgNote.value=r.ng_note||'';editorTitle.textContent=`店舗編集：${r.store_name||r.store_id}`;archiveButton.textContent=r.status==='archived'?'復元':'アーカイブ';archiveButton.classList.toggle('danger',r.status!=='archived');editorBackdrop.classList.remove('hidden')}
function closeEditor(){editorBackdrop.classList.add('hidden');state.editing=null}
function buildPayload(status){const agency=state.agencies.find(r=>String(r.agency_id)===editAgencyId.value)||{};return{store_id:editStoreId.value,agency_id:editAgencyId.value,agency_name:agency.agency_name||'',store_name:editStoreName.value.trim(),store_short_name:editStoreShortName.value.trim(),store_area:editStoreArea.value.trim(),address:editAddress.value.trim(),nearest_station:editNearestStation.value.trim(),preferred_member_ids:editPreferredMemberIds.value.trim(),preferred_note:editPreferredNote.value.trim(),ng_member_ids:editNgMemberIds.value.trim(),ng_note:editNgNote.value.trim(),status}}
async function saveStore(status){const p=buildPayload(status);if(!p.agency_id||!p.store_name){setMessage('代理店と店舗名は必須です。','error');return}saveButton.disabled=true;try{const j=await postOrderCaseAction('updateStoreMaster',p);if(!j.ok)throw new Error(j.message||'保存できませんでした。');setMessage(`${p.store_name}を保存しました。`,'success');closeEditor();await loadStores()}catch(e){setMessage(e.message,'error')}finally{saveButton.disabled=false}}
async function toggleArchive(){if(!state.editing)return;const archived=state.editing.status==='archived';const action=archived?'復元':'アーカイブ';if(!confirm(`${state.editing.store_name}を${action}しますか？\n過去案件は変更されません。`))return;await saveStore(archived?'active':'archived')}
function setMessage(t,type){messageBox.textContent=t;messageBox.className=`message ${type||''}`}
</script></body></html>

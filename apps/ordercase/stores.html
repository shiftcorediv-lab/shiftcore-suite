<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrderCase 店舗マスター</title>
  <link rel="stylesheet" href="./css/common.css" />
  <script defer src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
  <style>
    main { max-width: 980px; }
    .store-list { display: grid; gap: 12px; }
    .store-card { padding: 14px; border: 1px solid #e3e7eb; border-radius: 12px; background: #fff; }
    .store-title { font-weight: bold; margin-bottom: 10px; }
    .actions { display: flex; justify-content: flex-end; margin-top: 10px; }
  </style>
</head>
<body>
  <header id="ordercaseHeader"></header>
  <main>
    <section>
      <h2>店舗マスター</h2>
      <p class="hint">案件登録の候補として使う正式情報です。保存しても過去案件の店舗名は一括変更しません。</p>
      <input id="searchInput" placeholder="代理店名・店舗名・略称で検索" />
      <div id="messageBox" class="message"></div>
    </section>
    <div id="storeList" class="store-list"></div>
  </main>
  <script src="./js/config.js"></script><script src="./js/utils.js"></script>
  <script src="./js/auth-session.js"></script><script src="./js/api.js"></script>
  <script src="./js/navigation.js"></script>
  <script>
    const state = { stores: [], permission: '' };
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        renderOrderCaseHeader('stores', '店舗マスター編集');
        const permission = await fetchApiJson('getOrderCasePermission');
        if (!permission.ok || !permission.data?.can_edit) throw new Error('店舗マスターの編集権限がありません。');
        state.permission = permission.permission;
        await loadStores();
        document.getElementById('searchInput').addEventListener('input', renderStores);
      } catch (error) { setMessage(error.message, 'error'); }
    });
    async function loadStores() {
      const json = await fetchApiJson('listStoresMaster');
      if (!json.ok) throw new Error(json.message || '店舗一覧を取得できませんでした。');
      state.stores = json.data || [];
      renderStores();
    }
    function renderStores() {
      const keyword = normalizeText(document.getElementById('searchInput').value);
      const rows = state.stores.filter(row => !keyword || normalizeText([row.agency_name,row.store_name,row.store_short_name].join(' ')).includes(keyword));
      document.getElementById('storeList').innerHTML = rows.map(row => `
        <div class="store-card" data-store-id="${escapeHtml(row.store_id)}">
          <div class="store-title">${escapeHtml(row.store_id)} / ${escapeHtml(row.store_name)}</div>
          <div class="grid two">
            <div><label>代理店名</label><input data-field="agency_name" value="${escapeHtml(row.agency_name)}"></div>
            <div><label>正式店舗名</label><input data-field="store_name" value="${escapeHtml(row.store_name)}"></div>
            <div><label>店舗略称</label><input data-field="store_short_name" value="${escapeHtml(row.store_short_name)}"></div>
            <div><label>エリア</label><input data-field="store_area" value="${escapeHtml(row.store_area)}"></div>
            <div><label>住所</label><input data-field="address" value="${escapeHtml(row.address)}"></div>
            <div><label>最寄り駅</label><input data-field="nearest_station" value="${escapeHtml(row.nearest_station)}"></div>
          </div>
          <div class="actions"><button type="button" data-save>この店舗を保存</button></div>
        </div>`).join('') || '<p class="hint">該当する店舗はありません。</p>';
      document.querySelectorAll('[data-save]').forEach(button => button.addEventListener('click', saveStore));
    }
    async function saveStore(event) {
      const card = event.target.closest('[data-store-id]');
      const payload = { store_id: card.dataset.storeId };
      card.querySelectorAll('[data-field]').forEach(input => payload[input.dataset.field] = input.value.trim());
      event.target.disabled = true;
      try {
        const json = await postOrderCaseAction('updateStoreMaster', payload);
        if (!json.ok) throw new Error(json.message || '保存できませんでした。');
        setMessage(`${payload.store_name}を保存しました。`, 'success');
        await loadStores();
      } catch (error) { setMessage(error.message, 'error'); }
      finally { event.target.disabled = false; }
    }
    function setMessage(text, type) { const box = document.getElementById('messageBox'); box.textContent = text; box.className = `message ${type || ''}`; }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="../common/environment.js?v=20260902-banner-height-1"></script>
<title>オーダー 代理店マスター</title><link rel="stylesheet" href="./css/common.css"><link rel="stylesheet" href="./css/master-management.css">
<script defer src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script><script defer src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script><script src="../theme/shiftcore-theme.js"></script><link rel="stylesheet" href="../theme/shiftcore-theme.css?v=20260903-module-header-1"></head>
<body><header id="ordercaseHeader"></header><main class="master-page">
<section class="master-hero"><div><p class="master-eyebrow">ORDER MASTER</p><h2>代理店マスター</h2><p class="hint">代理店単位の連絡先と指名・NGを管理します。過去案件の名称は書き換えません。</p></div><button id="newButton" type="button">代理店を新規登録</button></section>
<div class="master-kpis"><div class="master-kpi"><span>有効</span><strong id="activeCount">0</strong></div><div class="master-kpi"><span>仮登録</span><strong id="provisionalCount">0</strong></div><div class="master-kpi"><span>アーカイブ</span><strong id="archivedCount">0</strong></div><div class="master-kpi"><span>紐づく店舗</span><strong id="storeCount">0</strong></div></div>
<section class="master-toolbar"><input id="searchInput" placeholder="代理店名・略称・担当者で検索"><select id="statusFilter"><option value="active">有効のみ</option><option value="all">すべて</option><option value="archived">アーカイブのみ</option></select><span></span></section><div id="messageBox" class="message"></div><div id="agencyList" class="master-list"></div></main>
<div id="editorBackdrop" class="master-dialog-backdrop hidden"><div class="master-dialog"><h2 id="editorTitle">代理店編集</h2><input id="editAgencyId" type="hidden"><div class="grid two"><div><label>正式代理店名</label><input id="editAgencyName"></div><div><label>代理店略称</label><input id="editAgencyShortName"></div><div><label>担当者名</label><input id="editContactName"></div><div><label>電話番号</label><input id="editPhone"></div><div><label>メールアドレス</label><input id="editEmail" type="email"></div><div><label>状態</label><select id="editStatus"><option value="active">有効</option><option value="archived">アーカイブ</option></select></div></div>
<div class="master-rule-section"><h3>代理店単位の配置ルール</h3><div class="grid two"><div><label>代理店指名メンバー</label><textarea id="editPreferredMemberIds" placeholder="内部ID・アカウントコードをカンマ区切り"></textarea><label>指名理由</label><textarea id="editPreferredNote" placeholder="例：商品知識と先方評価が高い"></textarea></div><div><label>代理店NGメンバー（非推奨）</label><textarea id="editNgMemberIds" placeholder="内部ID・アカウントコードをカンマ区切り"></textarea><label>NG理由</label><textarea id="editNgNote" placeholder="例：過去の相性を考慮。配置自体は可能"></textarea></div></div><p class="hint">NGは配置禁止ではありません。シフト配置時に理由を示して確認します。</p></div>
<div class="mt-16"><label>管理メモ</label><textarea id="editMemo"></textarea></div><div class="master-actions"><button id="archiveButton" type="button" class="archive">アーカイブ</button><button id="cancelButton" type="button" class="secondary">閉じる</button><button id="saveButton" type="button">保存</button></div></div></div>
<script src="./js/config.js"></script><script src="./js/utils.js"></script><script src="./js/auth-session.js"></script><script src="./js/api.js?v=20260905-agency-master-1"></script><script src="./js/navigation.js?v=20260905-agency-master-1"></script><script src="./js/agencies-master.js?v=20260905-agency-master-1"></script></body></html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="../common/environment.js?v=20260902-banner-height-1"></script>
  <title>オフ</title>
  <link rel="preconnect" href="https://script.google.com" />
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin />
  <link rel="stylesheet" href="../../shared/css/pmo-header.css" />
  <link rel="stylesheet" href="./css/pmo.css" />
  <script src="../theme/shiftcore-theme.js?v=20260903-responsive-layout-1"></script>
  <link rel="stylesheet" href="../theme/shiftcore-theme.css?v=20260903-responsive-layout-1">
  <link rel="stylesheet" href="../theme/portal-field-responsive.css?v=20260903-responsive-layout-1">
</head>
<body data-portal-surface="field">
  <div id="lineWarningBanner" style="background:#ffebee;color:#c62828;text-align:center;padding:12px;font-size:14px;font-weight:bold;border-bottom:1px solid #ffcdd2;">
    ⚠ LINE内ブラウザでは正常に動作しない場合があります。<br>
    ブラウザメニューから「外部ブラウザで開く」を選択してください。
  </div>

  <div class="container">
    <header class="pmo-header portal-module-header">
      <div class="portal-module-heading">
        <a class="portal-brand" href="../account-console/dashboard.html" aria-label="Another Portal ダッシュボードへ戻る">
          <span class="portal-brand-mark" aria-hidden="true"><span></span><span></span></span>
          <span class="portal-brand-copy"><strong>Another Portal</strong><small>WORKFORCE PLATFORM</small></span>
        </a>
        <div class="portal-module-title">
          <h1 class="pmo-header-title">オフ</h1>
          <p class="pmo-header-subtitle">希望休申請</p>
        </div>
      </div>

      <div class="pmo-header-actions">
        <button class="pmo-dashboard-button" id="dashboardBtn" type="button">ダッシュボードへ戻る</button>
      </div>
    </header>

    <div id="mainFormArea">
    <div class="card">
      <h2>提出者情報</h2>
      <div class="description">
        Another Portal連携でログイン済みの状態です。翌月の希望休を提出してください。
      </div>

      <div id="entryBannerArea"></div>

      <label>ログインユーザー</label>
      <div class="info-box" id="userNameBox" data-shiftcore-loading="true" aria-busy="true">取得中...</div>

      <div class="mt-12">
        <label>社員コード</label>
        <div class="info-box" id="employeeCodeBox" data-shiftcore-loading="true" aria-busy="true">取得中...</div>
      </div>

      <div class="mt-12">
        <label>アカウント情報</label>
        <div id="accountMetaArea"></div>
      </div>

      <div class="mt-12" id="inactiveWarningArea" style="display:none;">
        <div class="danger-box">
          このアカウントは現在「非稼働（off）」です。<br>
          希望休の提出対象外のため、この画面からは送信できません。
        </div>
      </div>
    </div>

    <div class="card">
      <h2>希望休選択</h2>

      <div class="month-control">
        <div class="month-title" id="monthTitle"></div>
      </div>

      <div class="weekday-row">
        <div class="weekday sun">日</div>
        <div class="weekday">月</div>
        <div class="weekday">火</div>
        <div class="weekday">水</div>
        <div class="weekday">木</div>
        <div class="weekday">金</div>
        <div class="weekday sat">土</div>
      </div>

      <div class="calendar-grid" id="calendarGrid"></div>

      <div class="button-row mt-12">
        <button class="clear-btn" id="noHolidayBtn" type="button">希望休なし</button>
        <button class="clear-btn" id="clearSelectionBtn" type="button">選択をクリア</button>
      </div>

      <div class="mt-16">
        <label>選択中の希望休</label>
        <div class="selected-list" id="selectedDatesBox">未選択</div>
        <div class="hint" id="noHolidayHint"></div>
      </div>
    </div>

    <div class="card">
      <h2>補足メモ</h2>
      <label for="note">メモ</label>
      <textarea id="note" placeholder="任意で補足を入力"></textarea>
    </div>

    <div class="card">
      <button class="submit-btn" id="submitBtn" type="button">希望休を送信</button>
      <div class="message" id="messageBox"></div>
    </div>
  </div>

  <div id="completeScreen">
    <div class="card">
      <div class="complete-icon">✅</div>
      <div class="complete-title">送信完了</div>
      <div class="complete-text" id="completeText">希望休の送信が完了しました。</div>
      <div class="complete-detail" id="completeDetail"></div>
      <button class="submit-btn mt-16" id="backToFormBtn" type="button">入力画面へ戻る</button>
    </div>
  </div>
  </div>

  <script type="module" src="./js/main.js?v=20260903-display-labels-1"></script>
</body>
</html>

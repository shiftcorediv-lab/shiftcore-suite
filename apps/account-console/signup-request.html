<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="../common/environment.js?v=20260830-staging-1"></script>
  <title>利用申請</title>
  <link rel="stylesheet" href="./css/signup-request.css" />
  <link rel="stylesheet" href="./css/line-browser-guard.css" />
  <script src="../theme/shiftcore-theme.js"></script>
  <link rel="stylesheet" href="../theme/shiftcore-theme.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>利用申請</h1>
      <div class="description">
        Account Console の利用申請を行います。
      </div>

      <label>ログイン中メールアドレス</label>
      <div class="info-box" id="emailBox">取得中...</div>
    </div>

    <div class="card">
      <div class="name-grid">
        <div>
          <label for="familyNameInput">姓</label>
          <input type="text" id="familyNameInput" class="text-box" autocomplete="family-name" placeholder="例：山田" />
        </div>
        <div>
          <label for="givenNameInput">名</label>
          <input type="text" id="givenNameInput" class="text-box" autocomplete="given-name" placeholder="例：太郎" />
        </div>
      </div>

      <label for="applicantTypeSelect" class="mt-12">アカウント種別</label>
      <select id="applicantTypeSelect" class="select-box">
        <option value="">選択してください</option>
        <option value="employee">弊社内人員</option>
        <option value="partner_individual">アライアンス個人</option>
        <option value="partner_company_admin">アライアンス法人 管理者</option>
      </select>

      <label for="companyNameInput" class="mt-12">所属ID / 所属名</label>
      <input type="text" id="companyNameInput" class="text-box" placeholder="例：internal / ORG-001 / 所属名" />
      <div class="hint">アライアンスの場合は、会社名・屋号・所属名を入力してください。</div>

      <label for="phoneInput" class="mt-12">電話番号</label>
      <input type="text" id="phoneInput" class="text-box" placeholder="例：09012345678" />
      <div class="hint">承認連絡や確認事項の連絡先として使用します。</div>

      <label for="noteInput" class="mt-12">備考</label>
      <textarea id="noteInput" class="text-area" placeholder="補足があれば入力してください"></textarea>
    </div>

    <div class="card">
      <div class="button-stack">
        <button class="submit-btn" id="submitBtn" type="button">利用申請を送信</button>
        <button class="back-btn" id="backToLoginBtn" type="button">ログイン画面へ戻る</button>
      </div>

      <div class="message" id="messageBox"></div>
    </div>
  </div>

  <script type="module" src="./js/signup-request/main.js"></script>
<script type="module">
  import { initLineBrowserGuard } from "./js/common/line-browser-guard.js";
  initLineBrowserGuard({ pageLabel: "利用申請画面" });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Another Portal 実績報告管理</title>
  <link rel="stylesheet" href="./css/work-report-admin.css?v=20260830-report-admin-1">
  <script src="../theme/shiftcore-theme.js"></script>
  <link rel="stylesheet" href="../theme/shiftcore-theme.css">
</head>
<body>
  <header>
    <nav><a href="./dashboard.html">← Dashboard</a><a href="./attendance-admin.html">勤怠管理</a></nav>
    <div><small>WORK REPORTS</small><h1>実績報告管理</h1></div>
    <button id="refreshBtn" type="button">更新</button>
  </header>
  <main>
    <section class="filter-panel">
      <label>開始日<input id="dateFrom" type="date"></label>
      <label>終了日<input id="dateTo" type="date"></label>
      <label>提出状態<select id="statusFilter"><option value="">すべて</option><option>未提出</option><option>提出済み</option></select></label>
      <label>検索<input id="searchInput" placeholder="店舗・氏名・案件"></label>
      <label>集計軸<select id="groupBy"><option value="day">日別</option><option value="month">月別</option><option value="store">店舗別</option><option value="person">人員別</option><option value="plan">案件別</option></select></label>
      <button id="applyBtn" type="button">表示</button>
      <button id="csvBtn" class="secondary" type="button">CSV出力</button>
    </section>

    <section id="summary" class="summary"></section>

    <section class="panel">
      <div class="panel-title"><div><small>SUBMISSIONS</small><h2>提出状況</h2></div></div>
      <div class="table-wrap"><table><thead><tr><th>勤務日</th><th>氏名</th><th>店舗</th><th>案件</th><th>状態</th><th>報告日時</th><th></th></tr></thead><tbody id="submissionRows"></tbody></table></div>
    </section>

    <section class="panel">
      <div class="panel-title"><div><small>AGGREGATION</small><h2>数値実績集計</h2></div></div>
      <div class="table-wrap"><table><thead><tr><th>集計単位</th><th>報告数</th><th>カテゴリ</th><th>項目</th><th>合計</th></tr></thead><tbody id="aggregateRows"></tbody></table></div>
    </section>

    <section class="panel">
      <div class="panel-title"><div><small>ITEM MASTER</small><h2>実績項目管理</h2></div><button id="showAddItemBtn" type="button">項目を追加</button></div>
      <p class="hint">停止した項目は新しい入力画面から外れます。過去回答は回答時点の名称・型・カテゴリで保持されます。</p>
      <div class="table-wrap"><table class="item-table"><thead><tr><th>項目名</th><th>種別</th><th>カテゴリ</th><th>表示順</th><th>必須</th><th>有効</th><th>版</th><th></th></tr></thead><tbody id="itemRows"></tbody></table></div>
    </section>
    <div id="message" role="status" aria-live="polite"></div>
  </main>

  <dialog id="detailDialog"><form method="dialog"><div class="dialog-title"><h2>実績報告詳細</h2><button value="cancel" aria-label="閉じる">×</button></div><div id="detailBody"></div></form></dialog>
  <dialog id="itemDialog"><form id="itemForm" method="dialog"><div class="dialog-title"><h2>実績項目を追加</h2><button value="cancel" aria-label="閉じる">×</button></div><label>項目名<input id="newItemName" maxlength="100" required></label><label>種別<select id="newItemType"><option value="number">数値</option><option value="text">文章</option></select></label><label>カテゴリ名<input id="newCategoryName" maxlength="60" required></label><label>表示順<input id="newDisplayOrder" type="number" min="0" step="1" required></label><label class="check"><input id="newRequired" type="checkbox">必須</label><div class="dialog-actions"><button value="cancel" type="button" id="cancelItemBtn">キャンセル</button><button type="submit">追加する</button></div></form></dialog>
  <script type="module" src="./js/work-report-admin/main.js?v=20260830-report-admin-1"></script>
</body>
</html>

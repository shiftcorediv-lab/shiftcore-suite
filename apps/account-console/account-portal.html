<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="../common/environment.js?v=20260902-banner-height-1"></script>
  <title>Another Portal メンバー</title>
  <link rel="stylesheet" href="./css/account-portal.css" />
  <script src="../theme/shiftcore-theme.js?v=20260906-header-2"></script>
  <link rel="stylesheet" href="../theme/shiftcore-theme.css?v=20260907-slot-color-2">
</head>
<body>
  <div class="container">
    <header class="pmo-header portal-module-header">
      <div class="portal-module-heading">
        <a class="portal-brand" href="./dashboard.html" aria-label="Another Portal ダッシュボードへ戻る">
          <span class="portal-brand-mark" aria-hidden="true"><span></span><span></span></span>
          <span class="portal-brand-copy"><strong>Another Portal</strong><small>WORKFORCE PLATFORM</small></span>
        </a>
        <div class="portal-module-title"><h1>メンバー</h1><p class="portal-subtitle">登録申請管理</p></div>
      </div>
      <div class="pmo-header-actions"><button class="back-btn" id="backToDashboardBtn" type="button">ダッシュボードへ戻る</button></div>
    </header>
    <div class="card">
      <h2>メンバー管理</h2>
      <div class="description">メンバー登録に関する管理機能を選択してください。</div>

      <div id="entryBannerArea"></div>

      <label>ログインユーザー</label>
      <div class="info-box" id="userNameBox">取得中...</div>

      <div class="mt-12">
        <label>アカウントコード</label>
        <div class="info-box" id="employeeCodeBox">取得中...</div>
      </div>

      <div class="mt-12">
        <label>アカウント情報</label>
        <div id="accountMetaArea"></div>
      </div>
    </div>

    <div class="card">
      <h2>操作を選択</h2>

      <div class="button-stack">
        <button class="main-btn" id="goSignupAdminBtn" type="button">登録申請管理</button>
      </div>

      <div class="hint" id="portalHint">管理対象ロールのみ利用できます。</div>
    </div>

    <div class="message" id="messageBox"></div>
  </div>

  <script type="module" src="./js/account-portal/main.js?v=20260906-display-labels-1"></script>
</body>
</html>

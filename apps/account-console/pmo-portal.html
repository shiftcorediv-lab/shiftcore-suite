<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="../common/environment.js?v=20260902-banner-height-1"></script>
  <title>オフ</title>
  <link rel="stylesheet" href="../../shared/css/pmo-header.css" />
  <link rel="stylesheet" href="./css/pmo-portal.css" />
  <script src="../theme/shiftcore-theme.js?v=20260906-header-2"></script>
  <link rel="stylesheet" href="../theme/shiftcore-theme.css?v=20260906-header-2">
</head>
<body>
  <div class="container">
    <header class="pmo-header portal-module-header">
      <div class="portal-module-heading">
        <a class="portal-brand" href="./dashboard.html" aria-label="Another Portal ダッシュボードへ戻る">
          <span class="portal-brand-mark" aria-hidden="true"><span></span><span></span></span>
          <span class="portal-brand-copy"><strong>Another Portal</strong><small>WORKFORCE PLATFORM</small></span>
        </a>
        <div class="portal-module-title"><h1 class="pmo-header-title">オフ</h1><p class="pmo-header-subtitle">希望休メニュー</p></div>
      </div>

      <div class="pmo-header-actions">
        <button class="pmo-dashboard-button" id="backToDashboardBtn" type="button">ダッシュボードへ戻る</button>
      </div>
    </header>

    <div id="developerMetaArea" class="developer-meta" style="display: none;"></div>

    <div class="card compact-card">
      <h2>ログイン情報</h2>

      <div class="info-compact-grid info-compact-grid-3">
        <div class="info-compact-item">
          <label>ログインユーザー</label>
          <div class="info-box" id="userNameBox">取得中...</div>
        </div>

        <div class="info-compact-item">
          <label>アカウントコード</label>
          <div class="info-box" id="employeeCodeBox">取得中...</div>
        </div>

        <div class="info-compact-item">
          <label>アカウント種別</label>
          <div class="info-box" id="roleBox">取得中...</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>操作を選択</h2>

      <div class="button-stack">
        <button class="submit-btn" id="goApplyBtn" type="button">希望休を申請する</button>
        <button class="manage-btn" id="goManageBtn" type="button">希望休を管理する</button>
      </div>

      <div class="hint" id="manageHint">
        管理機能は管理対象ロールのみ利用できます。
      </div>
    </div>

    <div class="message" id="messageBox"></div>
  </div>

  <script type="module" src="./js/pmo-portal/main.js?v=20260906-display-labels-1"></script>
</body>
</html>

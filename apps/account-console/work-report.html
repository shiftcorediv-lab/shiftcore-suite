<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="../common/environment.js?v=20260830-staging-1"></script>
  <title>Another Portal 実績報告</title>
  <link rel="stylesheet" href="./css/work-report.css?v=20260831-report-confirmation-1">
  <script src="../theme/shiftcore-theme.js"></script>
  <link rel="stylesheet" href="../theme/shiftcore-theme.css">
</head>
<body>
  <main>
    <a href="./dashboard.html">← Dashboard</a>
    <section>
      <small>DAILY REPORT</small>
      <h1>実績報告</h1>
      <p>終了済みの勤怠記録と実績項目を確認して表示します。案件・店舗・勤務日は勤怠記録から確定します。</p>
      <div id="loadingState" class="loading-state" data-shiftcore-loading="true" aria-busy="true">実績項目を読み込んでいます…</div>
      <dl id="reportContext" class="report-context" hidden></dl>
      <div id="revisionNotice" class="revision-notice" hidden></div>
      <form id="reportForm" hidden>
        <p class="form-help">数値項目の未入力は0件として保存し、未入力だったことも記録します。</p>
        <div id="reportFields" class="report-fields"></div>
        <button id="submitBtn">実績報告を送信</button>
      </form>
      <div id="completionState" class="completion-state" hidden>
        <small>WORK COMPLETE</small>
        <h2 id="completionTitle"></h2>
        <p id="completionMessage"></p>
        <p id="completionDetail" class="completion-detail"></p>
        <button id="dashboardBtn" type="button">Dashboardへ戻る</button>
      </div>
    </section>
  </main>
  <dialog id="reportConfirmDialog" class="confirm-dialog" aria-labelledby="confirmTitle">
    <div class="confirm-heading">
      <small>FINAL CHECK</small>
      <h2 id="confirmTitle">送信内容を確認</h2>
      <p>内容を確認してから確定してください。入力へ戻っても内容は消えません。</p>
    </div>
    <div id="confirmContext" class="confirm-context"></div>
    <div id="confirmAnswers" class="confirm-answers"></div>
    <div id="confirmMessage" role="status" aria-live="polite"></div>
    <div class="confirm-actions">
      <button id="editReportBtn" type="button" class="secondary-button">入力へ戻る</button>
      <button id="confirmSubmitBtn" type="button">この内容で送信</button>
    </div>
  </dialog>
  <script type="module" src="./js/work-report/main.js?v=20260831-report-confirmation-2"></script>
</body>
</html>

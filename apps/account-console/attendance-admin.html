<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="../common/environment.js?v=20260902-banner-height-1"></script><title>Another Portal 勤怠管理</title><link rel="stylesheet" href="./css/attendance-admin.css?v=20260802"><script src="../theme/shiftcore-theme.js"></script><link rel="stylesheet" href="../theme/shiftcore-theme.css"></head>
<body><header><nav><a href="./dashboard.html">← Dashboard</a><a href="./work-report-admin.html">実績報告管理</a></nav><div><small>ADMINISTRATION</small><h1>本日の稼働状況</h1></div><button id="refreshBtn">更新</button></header>
<main><section id="summary" class="summary"></section><section class="toolbar"><div><label>表示<select id="statusFilter"><option value="">すべて</option><option>未開始</option><option>稼働中</option><option>開始遅延</option><option>終了済み</option><option>修正申請中</option></select></label><label>検索<input id="searchInput" placeholder="氏名・場所・メール"></label></div><label>終了漏れ通知<input id="endWarningTime" type="time"><button id="saveTimeBtn">保存</button></label></section><section class="panel"><div class="table-wrap"><table><thead><tr><th>氏名</th><th>予定</th><th>稼働場所</th><th>出発</th><th>入店</th><th>打刻状況</th><th>開始</th><th>終了</th><th>位置情報</th></tr></thead><tbody id="peopleRows"></tbody></table></div></section><section class="panel"><div class="panel-title"><h2>承認待ち</h2><span id="requestCount">0件</span></div><div id="requestList" class="request-list"></div></section><div id="message" role="status" aria-live="polite" data-shiftcore-loading="true" aria-busy="true">勤怠情報を読み込んでいます…</div></main><dialog id="reviewDialog"><form method="dialog"><h2>申請を確認</h2><div id="reviewBody"></div><label>コメント<textarea id="reviewReason"></textarea></label><div><button value="cancel">キャンセル</button><button id="rejectBtn" value="reject">却下</button><button id="approveBtn" value="approve">承認</button></div></form></dialog><script type="module" src="./js/attendance-admin/main.js?v=20260831-departure-location-1"></script></body></html>
